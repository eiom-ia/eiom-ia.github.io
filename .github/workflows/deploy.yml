name: Publier le site

on:
  push:
    # parcours-ia figure ici parce que main n'existe pas encore: le site doit
    # etre verifiable avant la fusion, le guide d'installation etant attendu
    # par les participant-e-s avant le week-end.
    branches: [main, parcours-ia]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: r-lib/actions/setup-r@v2
      # Les appels ellmer réels font partie du prévol manuel. La CI n'a besoin
      # que de testthat; résoudre tout l'arbre ellmer a déjà bloqué un runner.
      - run: Rscript -e 'install.packages("testthat", repos = "https://cloud.r-project.org")'
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      - run: Rscript tests/testthat.R
      - run: Rscript tests/integration-secours.R
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
